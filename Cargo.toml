[package]
name = "d3-graph-bench"
version = "0.1.0"
edition = "2021"

[lib]
name = "d3_graph_bench"
path = "src/lib.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
tokio-util = "0.7"
axum = { version = "0.7", features = ["multipart", "macros", "ws"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] } # Added 'fs' for static files
strsim = "0.11"
uuid = { version = "1.8", features = ["v4"] }

# Serialization & HTTP
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "multipart"] }

# Databases & State
neo4rs = "0.8" # Neo4j Graph client
qdrant-client = "1.7" # Vector DB client
rusqlite = { version = "0.31", features = ["bundled"] } # Local SQLite FTS5
tokio-postgres = "0.7"
deadpool-postgres = "0.14"

# Environment & Utilities
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
async-trait = "0.1.89"
thiserror = "1.0"
pdf-extract = "0.10.0"
rig = "0.37.0"
futures = "0.3"
futures-util = "0.3"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio-rustls", "json", "uuid", "macros"] }

